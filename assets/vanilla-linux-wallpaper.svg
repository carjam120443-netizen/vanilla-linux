<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.48" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>
  <g fill="none" stroke="#fff3d0" stroke-opacity="0.08">
    <circle cx="960" cy="500" r="330" stroke-width="2"/>
    <circle cx="960" cy="500" r="430" stroke-width="1"/>
    <circle cx="960" cy="500" r="530" stroke-width="1"/>
  </g>
  <g transform="translate(960 500)" text-anchor="middle" font-family="DejaVu Sans, sans-serif">
    <text y="-45" font-size="112" font-weight="700" fill="#fff3d0">Vanilla Linux</text>
    <text y="45" font-size="34" fill="#e2d2b7">Debian underneath. Vanilla on top.</text>
    <path d="M-245 92 Q0 145 245 92" fill="none" stroke="#fff3d0" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </g>
  <g transform="translate(960 755)" text-anchor="middle" font-family="DejaVu Sans, sans-serif">
    <text font-size="25" fill="#cdbda4">A Swiss Army knife for devs and normal users.</text>
  </g>
  <circle cx="160" cy="160" r="120" fill="#fff3d0" opacity="0.035" filter="url(#soft)"/>
  <circle cx="1760" cy="920" r="180" fill="#fff3d0" opacity="0.035" filter="url(#soft)"/>
</svg>
